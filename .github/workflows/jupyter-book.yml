# Jupyter Book (MyST) GitHub Pages Deploy
# Ensure your GitHub Pages settings for this repository are set to deploy with GitHub Actions.
# On push to main, syncs myst.yml TOC with notebooks on disk (in the runner only), then builds and deploys.
# myst.yml is not committed back: main is protected. Run sync-myst-toc.py locally when adding notebooks.

name: Jupyter Book (MyST) GitHub Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /88E-student

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync myst.yml TOC with notebooks
        run: |
          pip install pyyaml --quiet
          python3 .github/sync-myst-toc.py
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install Jupyter Book (via myst)
        run: npm install -g jupyter-book
      - name: Build HTML Assets
        run: jupyter-book build --html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
